# Keeps dependencies patched. Updates wait 14 days after release, matching the
# minimumReleaseAge supply-chain guard in pnpm-workspace.yaml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Prisma client and CLI must move together; upgrade them deliberately.
      - dependency-name: '@prisma/client'
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
