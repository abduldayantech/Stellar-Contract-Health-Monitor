# Scrape config used by docker-compose.monitoring.yml.
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: stellar-health-api
    static_configs:
      - targets: ['api:4000']
    # If METRICS_TOKEN is set on the API, add:
    # authorization:
    #   credentials: <METRICS_TOKEN>
  - job_name: stellar-health-worker
    static_configs:
      - targets: ['worker:4001']
