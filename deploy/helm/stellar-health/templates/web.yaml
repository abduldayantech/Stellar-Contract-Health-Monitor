apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sh.fullname" . }}-web
  labels:
    {{- include "sh.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "sh.selector" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sh.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      {{- with .Values.web.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "sh.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "sh.image" (list . "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.web.port }} }
          env:
            - name: API_URL
              value: {{ printf "http://%s-api:%v" (include "sh.fullname" .) .Values.api.port | quote }}
            - name: SESSION_COOKIE_SECURE
              value: {{ .Values.web.secureCookies | quote }}
            - name: PORT
              value: {{ .Values.web.port | quote }}
            - name: HOSTNAME
              value: '0.0.0.0'
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Next.js writes its cache here; the rest of the filesystem is read-only.
            - { name: next-cache, mountPath: /app/apps/web/.next/cache }
      volumes:
        {{- include "sh.tmpVolume" . | nindent 8 }}
        - name: next-cache
          emptyDir: {}
      {{- with .Values.web.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sh.fullname" . }}-web
  labels:
    {{- include "sh.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "sh.selector" (list . "web") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.web.port }}, targetPort: http }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sh.fullname" . }}
  labels: {{- include "sh.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sh.fullname" . }}-web
                port: { name: http }
{{- end }}
