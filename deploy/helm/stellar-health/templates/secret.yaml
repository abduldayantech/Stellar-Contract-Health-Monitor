{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sh.secretName" . }}
  labels: {{- include "sh.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_API_TOKEN: {{ required "secrets.adminApiToken is required (24+ random characters)" .Values.secrets.adminApiToken | quote }}
  SECRETS_ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required (openssl rand -base64 32)" .Values.secrets.encryptionKey | quote }}
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s?schema=public" .Values.postgresql.username (include "sh.postgresPassword" . | urlquery) (include "sh.postgresHost" .) .Values.postgresql.database | quote }}
  {{- else }}
  DATABASE_URL: {{ required "externalDatabase.url is required when postgresql.enabled is false" .Values.externalDatabase.url | quote }}
  {{- end }}
  METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
{{- end }}
