{{- if .Values.postgresql.enabled }}
{{- $name := include "sh.postgresHost" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "sh.labels" . | nindent 4 }}
  annotations:
    # Keep the generated password (and the data it protects) if the release is removed.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ include "sh.postgresPassword" . | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sh.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  selector: {{- include "sh.selector" (list . "postgresql") | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "sh.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: {{- include "sh.selector" (list . "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sh.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      automountServiceAccountToken: false
      # The alpine image's postgres user is uid 70.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $name }}, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: [pg_isready, -U, {{ .Values.postgresql.username | quote }}, -h, 127.0.0.1] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, {{ .Values.postgresql.username | quote }}, -h, 127.0.0.1] }
            periodSeconds: 15
            failureThreshold: 6
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
